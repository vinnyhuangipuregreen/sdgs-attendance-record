{% if request.headers.get("x-platform-embedded") != "1" %}<footer class="platform-footer"><div class="platform-footer-inner"><span>佛光永續學院</span><span>實踐永續 × 連動分析 × 行動改變 × 共創未來</span></div></footer>{% endif %}
<script>
(() => {
  const renderedYear = {{ request.state.academic_year.id if request.state.academic_year else 1 }};
  const annualFetch = window.fetch.bind(window);
  window.fetch = (input, options={}) => {
    const base = new URL(document.baseURI);
    const url = new URL(typeof input==='string' ? input : input.url,base.href);
    if(url.origin===base.origin && (url.pathname.startsWith('/api/') || url.pathname.startsWith('/attendance-admin/api/'))) {
      const headers=new Headers(options.headers || {});headers.set('X-Academic-Year',String(renderedYear));options={...options,headers};
    }
    return annualFetch(input,options);
  };
})();
</script>
