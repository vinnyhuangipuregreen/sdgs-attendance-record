<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>佛光永續學院簽到系統 - 學員登入</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/design-system.css?v=20261024_restore_attendance">
  <link rel="stylesheet" href="/static/css/attendance.css?v=20261019_ui1280">
</head>
<body class="sdgs-shell attendance-platform course-login min-h-screen bg-[#F8FAFC] flex items-center justify-center p-4">
  {% include "platform-nav.html" %}
  <div class="w-full max-w-[420px] bg-white rounded-[32px] shadow-sm border border-gray-100 p-8 sm:p-10 flex flex-col items-center">
    
    <!-- 頂部 iPure Green 綠色樹狀 Logo -->
    <div class="flex flex-col items-center mb-6">
      <svg class="w-16 h-16" viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="14" r="4.5" fill="#4CAF50" />
        <circle cx="18" cy="17" r="4.5" fill="#81C784" />
        <circle cx="30" cy="17" r="4.5" fill="#C8E6C9" />
        <circle cx="14" cy="22" r="4" fill="#66BB6A" />
        <circle cx="34" cy="22" r="4" fill="#A5D6A7" />
        <circle cx="24" cy="20" r="4" fill="#FFD54F" />
        <circle cx="20" cy="24" r="3.5" fill="#81C784" />
        <circle cx="28" cy="24" r="3.5" fill="#4CAF50" />
        <path d="M21 28c0 3-1.5 6-3 8v4h12v-4c-1.5-2-3-5-3-8 0-2 1-3.5 2-4.5-1.5-.5-3.5 0-5 1.5-1.5-1.5-3.5-2-5-1.5 1 1 2 2.5 2 4.5z" fill="#8D6E63" />
      </svg>
      <span class="text-[#15803D] font-serif italic text-lg tracking-wide mt-1">iPure Green</span>
    </div>

    <!-- 系統標題 -->
    <h1 class="text-2xl font-bold text-[#1F2937] mb-1.5 text-center tracking-tight">
      佛光永續學院簽到系統
    </h1>
    <p class="text-gray-400 text-sm mb-6 text-center">
      請使用報名時提供的資料登入
    </p>

    <!-- 錯誤訊息提示區塊 -->
    <div id="errorMsg" class="hidden w-full mb-4 p-3 bg-red-50 text-red-600 text-xs rounded-xl border border-red-200 text-center"></div>

    <!-- 學員登入表單 -->
    <form id="loginForm" class="w-full space-y-4">
      <div>
        <label class="block text-gray-700 font-semibold text-sm mb-1.5">學員 Email</label>
        <input 
          type="email" 
          id="email" 
          required 
          placeholder="請輸入報名時提供的 Email"
          class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#15803D]/30 focus:border-[#15803D] text-sm text-gray-800 placeholder-gray-400 transition"
        >
      </div>

      <div>
        <label class="block text-gray-700 font-semibold text-sm mb-1.5">學員聯絡電話</label>
        <input 
          type="tel" 
          id="phone" 
          required 
          placeholder="請輸入報名時提供的聯絡電話"
          class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#15803D]/30 focus:border-[#15803D] text-sm text-gray-800 placeholder-gray-400 transition"
        >
      </div>

      <!-- 登入按鈕 -->
      <button 
        type="submit" 
        id="submitBtn"
        class="w-full mt-2 bg-[#15803D] hover:bg-[#166534] text-white py-3.5 rounded-2xl font-medium text-base shadow-sm transition duration-150 active:scale-[0.99] cursor-pointer"
      >
        登入
      </button>

      <!-- 底部管理者入口連結 -->
      <div class="text-center pt-3">
        <a href="/admin/login" class="text-xs text-gray-400 hover:text-[#15803D] transition">
          切換至後台管理者登入 →
        </a>
      </div>
    </form>

  </div>

  <script>
    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById('errorMsg');
      const btn = document.getElementById('submitBtn');
      err.classList.add('hidden');
      err.innerText = '';
      btn.disabled = true;
      btn.innerText = '登入中...';

      try {
        const formData = new FormData();
        formData.append('email', document.getElementById('email').value.trim());
        formData.append('phone', document.getElementById('phone').value.trim());

        const res = await fetch('/api/auth/login', { 
          method: 'POST', 
          body: formData 
        });
        const data = await res.json();

        if (res.ok) {
          window.location.href = '/dashboard';
        } else {
          err.innerText = data.error || '登入失敗，請確認資料是否正確！';
          err.classList.remove('hidden');
        }
      } catch (e) {
        err.innerText = '連線失敗，請稍後再試！';
        err.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = '登入';
      }
    };
  </script>
{% include "platform-footer.html" %}
</body>
</html>
